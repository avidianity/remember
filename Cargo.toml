[workspace]
resolver = "3"
members = ["crates/remember-core", "crates/remember"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avidianity/remember"
rust-version = "1.90"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
