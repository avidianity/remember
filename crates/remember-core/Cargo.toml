[package]
name = "remember-core"
description = "Domain model, storage and recall behind the Remember MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_toon_format = "=0.2.0"
thiserror = "2.0.21"

[dev-dependencies]
insta = "1.48.0"
serde_json = "1.0.151"
tempfile = "3.27.0"
tiktoken-rs = "0.12.1"
