[package]
name = "remember"
description = "Shared memory and messaging MCP server for coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
remember-core = { version = "0.1.0", path = "../remember-core" }
rmcp = { version = "3.5.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "io-std", "signal", "macros", "time"] }
tokio-util = "0.7"

[dev-dependencies]
rmcp = { version = "3.5.0", features = ["client", "transport-child-process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.1", features = ["rt", "macros", "process"] }
