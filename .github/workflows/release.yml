name: Release

# Fire whenever a tag like v1.0.0 is pushed.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# The default GITHUB_TOKEN needs write access to create the release and
# upload assets.
permissions:
  contents: write

jobs:
  # Run the test suite first so a tag can never publish a broken build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # Create the GitHub release for this tag (idempotent: skips if it exists),
  # with notes auto-generated from the commits since the previous tag.
  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes --verify-tag

  # Build a binary for each platform and attach it to the release.
  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: remember
          target: ${{ matrix.target }}
          # Produces e.g. remember-x86_64-unknown-linux-gnu.tar.gz (.zip on Windows).
          archive: $bin-$target
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE-MIT,LICENSE-APACHE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
